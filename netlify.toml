[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/**"]

# Digital Asset Links for Google Play Store (TWA) verification
[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/.netlify/functions/assetlinks"
  status = 200
  force = true

[[redirects]]
  from = "/well-known/assetlinks.json"
  to = "/.netlify/functions/assetlinks"
  status = 200
  force = true

# API Serverless Functions Routing
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai/analyze-meal"
  to = "/.netlify/functions/analyze-meal"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai/calculate-meal"
  to = "/.netlify/functions/calculate-meal"
  status = 200
  force = true

# Catch-all for Express API routes (generate-menu, weekly-recipes, stripe, etc.)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) Fallback for React Router & client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for PWA Service Worker, Manifest, and Assetlinks
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
