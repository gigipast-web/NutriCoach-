<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriCoach - Mode Hors-Ligne</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #F8FAF8;
      color: #1E293B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #065F46;
      margin: 0 0 12px 0;
    }
    p {
      font-size: 15px;
      color: #64748B;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    button {
      background: #10B981;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🥗</div>
    <h1>NutriCoach Hors-Ligne</h1>
    <p>Vous êtes actuellement déconnecté d'Internet. Vos données locales enregistrées sont toujours disponibles dès le retour de la connexion.</p>
    <button onclick="window.location.reload()">Réessayer la connexion</button>
  </div>
</body>
</html>
